services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_METRICS=true
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=ai_lab_secret_key
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - ai-network
    restart: unless-stopped

networks:
  ai-network:
    external: true
