services:
  finetune:
    image: unsloth/unsloth:latest
    container_name: unsloth_trainer
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
      - ../../models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - JUPYTER_TOKEN=ai_lab_2026
    restart: unless-stopped
    working_dir: /workspace
